<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1814" />
    <title>Fading Memories</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Fading Memories</h1>
        <p class="tagline">Honest writing for an audience of zero.</p>
      </header>

      <section class="composer">
        <textarea
          id="entry-input"
          placeholder="What's on your mind? It vanishes in 72 hours."
          rows="6"
          autocomplete="off"
        ></textarea>
        <div class="composer-row">
          <span class="hint" id="char-count">0 characters</span>
          <button id="save-btn" type="button">Let it fade</button>
        </div>
      </section>

      <section class="entries">
        <h2 id="entries-heading">Fading</h2>
        <ul id="entries-list"></ul>
        <p class="empty" id="empty-state">Nothing here yet.</p>
      </section>

      <footer>
        <p>Entries live only in this browser. Nothing leaves your device.</p>
        <p><a href="about.html">About</a></p>
      </footer>
    </main>
    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
